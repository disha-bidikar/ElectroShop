server.port=8080

# Spring Application Name
spring.application.name=electroshop-backend

# Database Configuration (H2 by default, MySQL via ENV)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:electroshopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Properties
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
electroshop.jwt.secret=${JWT_SECRET:9a4f2c8d7e6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f}
electroshop.jwt.expiration-ms=86400000

# AI Configuration
electroshop.ai.provider=${AI_PROVIDER:gemini}
electroshop.ai.gemini-key=${GEMINI_API_KEY:}
electroshop.ai.openai-key=${OPENAI_API_KEY:}
electroshop.ai.gemini-model=${GEMINI_MODEL:gemini-1.5-flash}
electroshop.ai.openai-model=${OPENAI_MODEL:gpt-3.5-turbo}

# OpenAPI / Swagger Config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Logging
logging.level.com.electroshop=INFO
